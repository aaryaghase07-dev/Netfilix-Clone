
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Sign In</title>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #141414;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.signin-box {
    width: 350px;
    padding: 35px;
    background: #222;
    border-radius: 5px;
}

.signin-box h1 {
    margin-bottom: 25px;
}

.signin-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
}

.signin-box button {
    width: 100%;
    padding: 14px;
    background: #e50914;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

.signin-box p {
    color: #bbb;
    margin-top: 25px;
}

.signin-box a {
    color: white;
}
</style>

</head>
<body>

    <div class="signin-box">
        <h1>Sign In</h1>

        <form id="signinForm">
            <input type="email" id="email"
                placeholder="Email address" required>

            <input type="password" id="password"
                placeholder="Password" required>

            <button type="button" id="innersign">Sign In</button>
        </form>

        <p>New to Netflix? <a href="index.html">Sign up now</a></p>
    </div>

    <script>const signin = document.querySelector("#innersign");

signin.addEventListener("click", function() {
    alert("Sign In successful!");
    window.location.href = "index.html";
});</script>
</body>
</html>
